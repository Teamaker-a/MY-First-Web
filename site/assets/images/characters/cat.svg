<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6e5cc"/>
      <stop offset="1" stop-color="#dfc3a1"/>
    </linearGradient>
    <linearGradient id="suit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2f6ff"/>
      <stop offset="1" stop-color="#a9d8ff"/>
    </linearGradient>
    <linearGradient id="ear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc9dc"/>
      <stop offset="1" stop-color="#ff9fc4"/>
    </linearGradient>
  </defs>

  <!-- ears -->
  <path d="M52 80 62 28l34 34Z" fill="url(#fur)" stroke="#241d1c" stroke-width="6" stroke-linejoin="round"/>
  <path d="M148 80 138 28l-34 34Z" fill="url(#fur)" stroke="#241d1c" stroke-width="6" stroke-linejoin="round"/>
  <path d="M62 68 68 43l22 24Z" fill="url(#ear)"/>
  <path d="M138 68 132 43l-22 24Z" fill="url(#ear)"/>

  <!-- head -->
  <ellipse cx="100" cy="112" rx="62" ry="54" fill="url(#fur)" stroke="#241d1c" stroke-width="6"/>
  <ellipse cx="80" cy="88" rx="24" ry="13" fill="#ffffff" opacity=".35"/>

  <!-- giant eyes -->
  <ellipse cx="74" cy="112" rx="22" ry="26" fill="#241d1c"/>
  <ellipse cx="126" cy="112" rx="22" ry="26" fill="#241d1c"/>
  <circle cx="82" cy="101" r="7" fill="#ffffff"/>
  <circle cx="134" cy="101" r="7" fill="#ffffff"/>
  <circle cx="68" cy="120" r="3.5" fill="#ffffff" opacity=".8"/>
  <circle cx="120" cy="120" r="3.5" fill="#ffffff" opacity=".8"/>

  <!-- nose + tongue + blush -->
  <path d="M92 136q8 6 16 0-8 11-16 0Z" fill="#f08aa8" stroke="#241d1c" stroke-width="4" stroke-linejoin="round"/>
  <path d="M92 148q8 16 16 0Z" fill="#ff9fc4" stroke="#241d1c" stroke-width="4" stroke-linejoin="round"/>
  <ellipse cx="50" cy="134" rx="11" ry="6" fill="#ff9fc4" opacity=".55"/>
  <ellipse cx="150" cy="134" rx="11" ry="6" fill="#ff9fc4" opacity=".55"/>

  <!-- whiskers -->
  <path d="M39 118 12 110M39 128 11 130M161 118l27-8M161 128l28 2" fill="none" stroke="#241d1c" stroke-width="4" stroke-linecap="round"/>

  <!-- body + paws -->
  <path d="M46 168q54-22 108 0v28q-54 10-108 0Z" fill="url(#suit)" stroke="#241d1c" stroke-width="6" stroke-linejoin="round"/>
  <path d="M62 166q38 20 76 0" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>
  <ellipse cx="48" cy="186" rx="18" ry="12" fill="#d9f1ff" stroke="#241d1c" stroke-width="6"/>
  <ellipse cx="152" cy="186" rx="18" ry="12" fill="#d9f1ff" stroke="#241d1c" stroke-width="6"/>
</svg>
