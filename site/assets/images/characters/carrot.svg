  <path d="M62 166q38 20 76 0" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>
  <ellipse cx="48" cy="186" rx="18" ry="12" fill="#d9f1ff" stroke="#241d1c" stroke-width="6"/>
  <ellipse cx="152" cy="186" rx="18" ry="12" fill="#d9f1ff" stroke="#241d1c" stroke-width="6"/>
