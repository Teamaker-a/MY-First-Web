  <!-- leaves -->
  <path d="M100 62C82 48 60 20 70 10c12-10 26 20 30 40 4-22 18-46 30-38 12 8-6 38-22 52Z" fill="url(#leaf)" stroke="#241d1c" stroke-width="6" stroke-linejoin="round"/>
