<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="carrot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc47f"/>
      <stop offset="1" stop-color="#f08a3c"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b7e77d"/>
      <stop offset="1" stop-color="#65b84a"/>
