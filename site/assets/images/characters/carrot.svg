  <!-- sleepy eyes -->
  <path d="M62 108q0-12 18-12t18 12q-18 12-36 0Z" fill="#241d1c"/>
  <path d="M102 108q0-12 18-12t18 12q-18 12-36 0Z" fill="#241d1c"/>
