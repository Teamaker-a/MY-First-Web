<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7b5b32"/>
      <stop offset=".38" stop-color="#c9a76d"/>
      <stop offset=".62" stop-color="#e6d0a2"/>
      <stop offset="1" stop-color="#8c693b"/>
    </linearGradient>
    <linearGradient id="champagne" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#f3e6cd"/>
      <stop offset=".55" stop-color="#dfc59c"/>
      <stop offset="1" stop-color="#b99a6b"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="55%">
      <stop offset="0" stop-color="#d9bd8a" stop-opacity=".18"/>
      <stop offset="1" stop-color="#d9bd8a" stop-opacity="0"/>
    </radialGradient>

    <g id="petal" stroke="url(#gold)" stroke-width="1.6" stroke-linejoin="round">
      <path d="M0 0 C -36 -34 -42 -84 -14 -122 C 10 -108 28 -58 0 0 Z"/>
    </g>

    <g id="peony">
      <g fill="url(#champagne)" fill-opacity=".2">
        <use href="#petal" transform="rotate(0)"/>
        <use href="#petal" transform="rotate(45)"/>
        <use href="#petal" transform="rotate(90)"/>
        <use href="#petal" transform="rotate(135)"/>
        <use href="#petal" transform="rotate(180)"/>
        <use href="#petal" transform="rotate(225)"/>
        <use href="#petal" transform="rotate(270)"/>
        <use href="#petal" transform="rotate(315)"/>
      </g>
      <g fill="none">
        <use href="#petal" transform="rotate(0)"/>
        <use href="#petal" transform="rotate(45)"/>
        <use href="#petal" transform="rotate(90)"/>
        <use href="#petal" transform="rotate(135)"/>
        <use href="#petal" transform="rotate(180)"/>
        <use href="#petal" transform="rotate(225)"/>
        <use href="#petal" transform="rotate(270)"/>
        <use href="#petal" transform="rotate(315)"/>
      </g>
      <g transform="scale(.72) rotate(22.5)" fill="url(#champagne)" fill-opacity=".38" stroke="url(#gold)" stroke-width="1.5">
        <use href="#petal" transform="rotate(0)"/>
        <use href="#petal" transform="rotate(60)"/>
        <use href="#petal" transform="rotate(120)"/>
        <use href="#petal" transform="rotate(180)"/>
        <use href="#petal" transform="rotate(240)"/>
        <use href="#petal" transform="rotate(300)"/>
      </g>
      <g transform="scale(.43) rotate(7)" fill="url(#champagne)" fill-opacity=".38" stroke="url(#gold)" stroke-width="1.6">
        <use href="#petal" transform="rotate(0)"/>
        <use href="#petal" transform="rotate(72)"/>
        <use href="#petal" transform="rotate(144)"/>
        <use href="#petal" transform="rotate(216)"/>
        <use href="#petal" transform="rotate(288)"/>
      </g>
      <circle r="19" fill="url(#champagne)" fill-opacity=".4" stroke="url(#gold)" stroke-width="1.4"/>
      <g stroke="url(#gold)" stroke-width="1">
        <path d="M0 0 L0 -14 M0 0 L12 -7 M0 0 L12 7 M0 0 L0 14 M0 0 L-12 7 M0 0 L-12 -7"/>
      </g>
      <g fill="url(#champagne)" fill-opacity=".7">
        <circle cx="0" cy="-14" r="2.1"/>
        <circle cx="12" cy="-7" r="1.9"/>
        <circle cx="12" cy="7" r="1.9"/>
        <circle cx="0" cy="14" r="2.1"/>
        <circle cx="-12" cy="7" r="1.9"/>
        <circle cx="-12" cy="-7" r="1.9"/>
      </g>
    </g>

    <g id="orchid">
      <g fill="url(#champagne)" fill-opacity=".16">
        <use href="#petal" transform="rotate(0) scale(.58)"/>
        <use href="#petal" transform="rotate(72) scale(.58)"/>
        <use href="#petal" transform="rotate(144) scale(.58)"/>
        <use href="#petal" transform="rotate(216) scale(.58)"/>
        <use href="#petal" transform="rotate(288) scale(.58)"/>
      </g>
      <g fill="none">
        <use href="#petal" transform="rotate(0) scale(.58)"/>
        <use href="#petal" transform="rotate(72) scale(.58)"/>
        <use href="#petal" transform="rotate(144) scale(.58)"/>
        <use href="#petal" transform="rotate(216) scale(.58)"/>
        <use href="#petal" transform="rotate(288) scale(.58)"/>
      </g>
      <path d="M-15 18 Q0 50 15 18 Q0 34 -15 18Z" fill="url(#champagne)" fill-opacity=".22" stroke="url(#gold)" stroke-width="1.4"/>
      <circle r="8" fill="url(#champagne)" fill-opacity=".3" stroke="url(#gold)" stroke-width="1.2"/>
      <g stroke="url(#gold)" stroke-width="1" fill="none">
        <path d="M0 0 L0 -8 M0 0 L7 -4 M0 0 L7 4 M0 0 L-7 4 M0 0 L-7 -4"/>
      </g>
    </g>

    <g id="leaf" stroke="url(#gold)" stroke-width="1.5" fill="url(#champagne)" fill-opacity=".07">
      <path d="M0 0 C 34 -32 92 -30 128 4 C 92 30 34 24 0 0 Z"/>
      <path d="M4 -1 C 40 2 82 4 122 6" fill="none" stroke="url(#gold)" stroke-width="1"/>
    </g>
  </defs>

  <rect width="1000" height="1000" fill="none"/>

  <g stroke="url(#gold)" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M28 982 C 92 790 194 690 352 608"/>
    <path d="M58 990 C 176 848 306 772 492 686"/>
    <path d="M10 892 C 136 738 270 620 438 468"/>
    <path d="M86 948 C 210 832 380 780 568 772"/>
    <path d="M46 842 C 156 692 300 572 476 414"/>
  </g>

  <g fill="none">
    <use href="#leaf" transform="translate(92 902) rotate(-24) scale(.68)"/>
    <use href="#leaf" transform="translate(156 826) rotate(-38) scale(.58)"/>
    <use href="#leaf" transform="translate(252 760) rotate(-22) scale(.52)"/>
    <use href="#leaf" transform="translate(372 690) rotate(-28) scale(.46)"/>
    <use href="#leaf" transform="translate(486 620) rotate(-42) scale(.4)"/>
    <use href="#leaf" transform="translate(214 916) rotate(14) scale(.6)"/>
    <use href="#leaf" transform="translate(330 850) rotate(18) scale(.5)"/>
    <use href="#leaf" transform="translate(464 788) rotate(12) scale(.44)"/>
    <use href="#leaf" transform="translate(576 748) rotate(4) scale(.38)"/>
    <use href="#leaf" transform="translate(126 760) rotate(-64) scale(.5)"/>
    <use href="#leaf" transform="translate(238 646) rotate(-58) scale(.42)"/>
    <use href="#leaf" transform="translate(342 542) rotate(-48) scale(.36)"/>
  </g>

  <use href="#peony" transform="translate(252 686) rotate(-9) scale(1.42)"/>
  <use href="#peony" transform="translate(436 502) rotate(14) scale(1.02)"/>
  <use href="#peony" transform="translate(118 802) rotate(-24) scale(.78)"/>

  <g fill="none" stroke="url(#gold)" stroke-width="1.6" stroke-linecap="round">
    <path d="M540 760 C 604 690 674 654 782 628"/>
    <path d="M604 746 C 620 640 660 552 732 486"/>
    <path d="M470 560 C 492 458 532 366 604 286"/>
  </g>

  <use href="#orchid" transform="translate(594 700) rotate(-18) scale(1.12)"/>
  <use href="#orchid" transform="translate(690 620) rotate(12) scale(.92)"/>
  <use href="#orchid" transform="translate(744 500) rotate(30) scale(.78)"/>
  <use href="#orchid" transform="translate(526 384) rotate(-24) scale(.9)"/>
  <use href="#orchid" transform="translate(598 296) rotate(8) scale(.7)"/>

  <g fill="url(#champagne)" fill-opacity=".14" stroke="url(#gold)" stroke-width="1.4">
    <path d="M760 712 C 780 682 808 678 820 700 C 806 722 778 728 760 712Z"/>
    <path d="M476 508 C 490 482 510 480 520 498 C 508 516 488 522 476 508Z"/>
    <path d="M160 700 C 176 676 198 674 208 692 C 196 710 176 714 160 700Z"/>
  </g>

  <g fill="url(#gold)" opacity=".55">
    <circle cx="664" cy="818" r="2.2"/>
    <circle cx="722" cy="748" r="1.7"/>
    <circle cx="808" cy="654" r="2"/>
    <circle cx="386" cy="594" r="1.8"/>
    <circle cx="548" cy="438" r="2.2"/>
    <circle cx="642" cy="348" r="1.6"/>
    <circle cx="206" cy="860" r="1.8"/>
    <circle cx="308" cy="792" r="1.4"/>
    <circle cx="460" cy="700" r="1.7"/>
  </g>
</svg>
